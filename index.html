<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thông Điệp Của Thượng Đế</title>
<meta name="description" content="Mỗi ngày một thông điệp. Nhận rồi thì để nó đi.">
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="sky" aria-hidden="true"><canvas id="stars"></canvas></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g class="rays"><path d="M12 1v3.2M12 19.8V23M1 12h3.2M19.8 12H23M4.2 4.2l2.3 2.3M17.5 17.5l2.3 2.3M19.8 4.2l-2.3 2.3M6.5 17.5l-2.3 2.3"/></g></svg>
    <span>Thông Điệp Của Thượng Đế</span>
  </div>
  <button class="icon-btn" id="btn-about" aria-label="Giới thiệu">?</button>
</header>

<main>
  <p class="today-date" id="today-date"></p>

  <div class="stage">
    <div class="card-shell">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Lật lá thông điệp hôm nay">
        <div class="face back">
          <svg viewBox="0 0 200 300" class="back-art" aria-hidden="true">
            <defs><radialGradient id="g1" cx="50%" cy="42%" r="55%">
              <stop offset="0%" stop-color="#3b2f6b"/><stop offset="100%" stop-color="#14102c"/>
            </radialGradient></defs>
            <rect x="0" y="0" width="200" height="300" rx="16" fill="url(#g1)"/>
            <rect x="9" y="9" width="182" height="282" rx="11" fill="none" stroke="#c9a24d" stroke-opacity=".55"/>
            <rect x="15" y="15" width="170" height="270" rx="8" fill="none" stroke="#c9a24d" stroke-opacity=".22"/>
            <g stroke="#e8c37a" stroke-opacity=".75" fill="none" stroke-linecap="round">
              <circle cx="100" cy="126" r="26" stroke-opacity=".9"/>
              <circle cx="100" cy="126" r="40" stroke-opacity=".35"/>
              <circle cx="100" cy="126" r="54" stroke-opacity=".16"/>
              <g class="ray-set"><path d="M100 62v14M100 176v14M36 126h14M150 126h14M55 81l10 10M135 161l10 10M145 81l-10 10M65 161l-10 10"/></g>
            </g>
            <circle cx="100" cy="126" r="8" fill="#e8c37a" fill-opacity=".9"/>
            <text x="100" y="232" text-anchor="middle" class="back-word">Thông điệp</text>
            <text x="100" y="252" text-anchor="middle" class="back-word small">cho ngày hôm nay</text>
          </svg>
        </div>
        <div class="face front">
          <p class="message" id="message"></p>
          <div class="rule"></div>
          <p class="meaning" id="meaning"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="cta" id="cta">
    <button class="primary" id="btn-draw">Nhận thông điệp hôm nay</button>
    <p class="hint">Hít một hơi thật sâu, rồi chạm vào lá bài.</p>
  </div>

  <div class="after" id="after" hidden>
    <p class="ephemeral">Thông điệp của hôm nay chỉ có vậy.<br>Hãy giữ nó trong lòng cho hết ngày.</p>
    <div class="actions">
      <button class="ghost" id="btn-share"><span class="ico">↗</span>Chép lại</button>
    </div>
    <p class="countdown" id="countdown"></p>
  </div>
</main>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="handle" data-close></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
    <button class="primary wide" data-close>Đóng</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
